# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# (The workflow token is not allowed to create the Pages site itself.)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Supabase project for sign-in and cloud sync (README "Accounts"). Both values are public by
          # design; access is enforced by row-level security. Repository Variables of the same name
          # override these defaults (Settings -> Secrets and variables -> Actions -> Variables).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://zgtsfucgyfibczxnhqud.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_ynaucukQlifIWOvsHqoqQQ_818f9d_j' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
