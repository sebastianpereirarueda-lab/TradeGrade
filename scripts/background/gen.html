<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script>
const W = +new URLSearchParams(location.search).get("w") || 2400, H = Math.round(W * 9 / 16);
const SEED = +new URLSearchParams(location.search).get("seed") || 7;
const c = document.getElementById("c"); c.width = W; c.height = H;
const gl = c.getContext("webgl2", { preserveDrawingBuffer: true });
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0,1); }`;
const fs = `#version 300 es
precision highp float; out vec4 o; uniform vec2 R; uniform float S;
float h(vec2 p){ p = fract(p*vec2(123.34,456.21)+S*0.137); p += dot(p,p+45.32); return fract(p.x*p.y); }
float n(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),u.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<6;i++){ v+=a*n(p); p=m*p; a*=.5; } return v; }
vec3 pal(float t){ // deep jewel tones: teal, emerald, ochre, ember, crimson, violet, indigo
  vec3 c0=vec3(.03,.32,.36), c1=vec3(.07,.42,.24), c2=vec3(.56,.46,.10), c3=vec3(.72,.28,.06),
       c4=vec3(.58,.06,.16), c5=vec3(.46,.08,.50), c6=vec3(.12,.12,.48);
  t=fract(t)*7.; int i=int(floor(t)); float f=smoothstep(0.,1.,fract(t));
  vec3 a = i==0?c0: i==1?c1: i==2?c2: i==3?c3: i==4?c4: i==5?c5: c6;
  vec3 b = i==0?c1: i==1?c2: i==2?c3: i==3?c4: i==4?c5: i==5?c6: c0;
  return mix(a,b,f); }
void main(){
  vec2 uv = gl_FragCoord.xy / R.y;
  // anisotropic, rotated coordinates give long flowing streaks
  vec2 c0 = uv - vec2(.89,.5);
  float a = 0.9 + 0.9*length(c0); // swirl: rotation grows away from the centre
  mat2 rot = mat2(cos(a),-sin(a),sin(a),cos(a));
  vec2 p = rot*c0; p *= vec2(0.75, 1.05); p += S;
  vec2 q = vec2(fbm(p), fbm(p+vec2(5.2,1.3)));
  vec2 r = vec2(fbm(p+4.2*q+vec2(1.7,9.2)), fbm(p+4.2*q+vec2(8.3,2.8)));
  float f = fbm(p+4.5*r);
  vec3 col = pal(f*1.7 + length(q)*0.8 + r.x*0.5 + 0.1);
  // dark rivers between colour bands
  float band = abs(fract(f*3.2 + r.y*1.2) - 0.5);
  col *= 0.18 + 0.95*smoothstep(0.02, 0.22, band);
  // thin pale lacing along the flow
  float lace = 1.0 - smoothstep(0.0, 0.018, abs(fract(f*9.0 + q.x*2.0) - 0.5));
  col += lace * 0.10 * vec3(0.85,0.9,0.8);
  // oil cells
  float cells = smoothstep(0.66, 0.72, fbm(p*7.0 + r*3.0));
  col = mix(col, col*0.4 + vec3(.02,.03,.03), cells*0.5);
  col *= 0.75 + 0.45*f;
  vec2 d = gl_FragCoord.xy/R - .5; col *= 1.0 - 0.7*dot(d,d);
  o = vec4(col, 1.);
}`;
function sh(t, s){ const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if(!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
gl.uniform2f(gl.getUniformLocation(pr, "R"), W, H); gl.uniform1f(gl.getUniformLocation(pr, "S"), SEED);
gl.viewport(0, 0, W, H); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish();
window.DONE = true;
</script></body></html>
